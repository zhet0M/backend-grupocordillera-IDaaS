services:

  db-auth:
    image: postgres:15
    container_name: db-auth
    environment:
      POSTGRES_DB: bd_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5436:5432"
    volumes:
      - db-auth-data:/var/lib/postgresql/data
    networks:
      - cordillera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentication:
    build: ../authentication
    container_name: authentication
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-auth:5432/bd_auth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      db-auth:
        condition: service_healthy
    networks:
      - cordillera-net

  db-ventas:
    image: postgres:15
    container_name: db-ventas
    environment:
      POSTGRES_DB: bd_ventas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5433:5432"
    volumes:
      - db-ventas-data:/var/lib/postgresql/data
    networks:
      - cordillera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ventas:
    build: ../ventas
    container_name: ventas
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-ventas:5432/bd_ventas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      db-ventas:
        condition: service_healthy
    networks:
      - cordillera-net

  db-inventario:
    image: postgres:15
    container_name: db-inventario
    environment:
      POSTGRES_DB: bd_inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5434:5432"
    volumes:
      - db-inventario-data:/var/lib/postgresql/data
    networks:
      - cordillera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s 
      retries: 5

  inventario:
    build: ../inventario
    container_name: inventario
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-inventario:5432/bd_inventario
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      db-inventario:
        condition: service_healthy
    networks:
      - cordillera-net

  db-finanzas:
    image: postgres:15
    container_name: db-finanzas
    environment:
      POSTGRES_DB: bd_finanzas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5435:5432"
    volumes:
      - db-finanzas-data:/var/lib/postgresql/data
    networks:
      - cordillera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  finanzas:
    build: ../finanzas
    container_name: finanzas
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-finanzas:5432/bd_finanzas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      db-finanzas:
        condition: service_healthy
    networks:
      - cordillera-net

  db-clientes:
    image: postgres:15
    container_name: db-clientes
    environment:
      POSTGRES_DB: bd_clientes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5437:5432"
    volumes:
      - db-clientes-data:/var/lib/postgresql/data
    networks:
      - cordillera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  clientes:
    build: ../clientes
    container_name: clientes
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-clientes:5432/bd_clientes
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
    depends_on:
      db-clientes:
        condition: service_healthy
    networks:
      - cordillera-net

  db-alertas:
    image: postgres:15
    container_name: db-alertas
    environment:
      POSTGRES_DB: bd_alertas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5438:5432"
    volumes:
      - db-alertas-data:/var/lib/postgresql/data
    networks:
      - cordillera-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  ms-alertas:
    build: ../alertas
    container_name: ms-alertas
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-alertas:5432/bd_alertas
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      INVENTARIO_URL: http://inventario:8083/inventario
      VENTAS_URL: http://ventas:8082/ventas
      FINANZAS_URL: http://finanzas:8084/finanzas
      ALERTAS_DETECCION_DELAY_MS: 15000
    depends_on:
      db-alertas:
        condition: service_healthy
      inventario:
        condition: service_started
      ventas:
        condition: service_started
      finanzas:
        condition: service_started
    networks:
      - cordillera-net

  ms-kpis:
    build: ../kpis
    container_name: ms-kpis
    ports:
      - "8086:8086"
    environment:
      VENTAS_URL: http://ventas:8082/ventas
      INVENTARIO_URL: http://inventario:8083/inventario
      FINANZAS_URL: http://finanzas:8084/finanzas
      CLIENTES_URL: http://clientes:8085/clientes
    depends_on:
      - authentication
      - ventas
      - inventario
      - finanzas
      - clientes
    networks:
      - cordillera-net

  ms-reportes:
    build: ../reportes
    container_name: ms-reportes
    ports:
      - "8088:8088"
    environment:
      VENTAS_URL: http://ventas:8082/ventas
      INVENTARIO_URL: http://inventario:8083/inventario
      FINANZAS_URL: http://finanzas:8084/finanzas
    depends_on:
      - ventas
      - inventario
      - finanzas
    networks:
      - cordillera-net

  api-gateway:
    build: .
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      # ── Microsoft Entra ID (BFF) ──────────────────────────────────────────
      # Valores por defecto de la etapa 0. Sobreescribe al deployar (stg/prod).
      AZURE_TENANT_ID: 4250abc2-359b-45d6-8fb2-732e71b2a277
      AZURE_ISSUER: https://login.microsoftonline.com/4250abc2-359b-45d6-8fb2-732e71b2a277/v2.0
      AZURE_JWK_SET_URI: https://login.microsoftonline.com/4250abc2-359b-45d6-8fb2-732e71b2a277/discovery/v2.0/keys
      # Audience = Client ID de la API (GUID SIN prefijo api://)
      AZURE_AUDIENCE: 289a7d84-7d8d-4bea-b2a8-380f6e89043a
      AZURE_API_SCOPE: access_as_user
      # ── Seguridad / CORS ──────────────────────────────────────────────────
      SECURITY_SWAGGER_PUBLIC: "true"
      CORS_ALLOWED_ORIGINS: "http://localhost:4200,https://frontend-grupo-cordillera-angular.vercel.app"
      # ── URLs de microservicios (intra-docker, nombres de servicio) ────────
      KPIS_URL: http://ms-kpis:8086
    depends_on:
      - authentication
      - ventas
      - inventario
      - finanzas
      - clientes
      - ms-alertas
      - ms-kpis
      - ms-reportes
    networks:
      - cordillera-net

  db-metabase:
    image: postgres:15
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase123
    ports:
      - "5440:5432"
    volumes:
      - db-metabase-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cordillera-net

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabase123
      MB_DB_HOST: db-metabase
    depends_on:
      db-metabase:
        condition: service_healthy
    networks:
      - cordillera-net

  sonarqube-db:
    image: postgres:15
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    ports:
      - "5439:5432"
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - cordillera-net

  sonarqube:
    image: sonarqube:lts-community
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - cordillera-net

volumes:
  db-auth-data:
  db-ventas-data:
  db-inventario-data:
  db-finanzas-data:
  db-clientes-data:
  db-alertas-data:
  db-metabase-data:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:

networks:
  cordillera-net:
    driver: bridge
