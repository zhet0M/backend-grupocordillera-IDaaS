server.port=8080
spring.application.name=api-gateway

# ─────────────────────────────────────────────────────────────────────────────
# Microsoft Entra ID (BFF: API Gateway como OAuth2 Resource Server JWT)
# ─────────────────────────────────────────────────────────────────────────────
# NOTA: NO usamos spring.security.oauth2.resourceserver.jwt.issuer-uri porque
# éste le pega a Microsoft al arrancar (/.well-known/openid-configuration).
# En su lugar usamos jwk-set-uri EXPLÍCITO y validadores propios de issuer /
# audience / expiración, tal como lo pide el plan.
azure.tenant-id=${AZURE_TENANT_ID:4250abc2-359b-45d6-8fb2-732e71b2a277}
azure.issuer=${AZURE_ISSUER:https://login.microsoftonline.com/${azure.tenant-id}/v2.0}
azure.jwk-set-uri=${AZURE_JWK_SET_URI:https://login.microsoftonline.com/${azure.tenant-id}/discovery/v2.0/keys}

# Audience esperada: Client ID de la API (sin prefijo api://). OBLIGATORIA.
azure.audience=${AZURE_AUDIENCE:289a7d84-7d8d-4bea-b2a8-380f6e89043a}

# Scope esperado en el claim "scp" del access token (Etapa 2 valida esto).
azure.api-scope=${AZURE_API_SCOPE:access_as_user}

# ── Configuración de Spring Security OAuth2 Resource Server ─────────────────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${azure.jwk-set-uri}

# ─────────────────────────────────────────────────────────────────────────────
# Swagger público (por defecto true en local; en prod sobreescribir por env var)
# ─────────────────────────────────────────────────────────────────────────────
security.swagger-public=${SECURITY_SWAGGER_PUBLIC:true}

# ─────────────────────────────────────────────────────────────────────────────
# CORS (configurable por environment). Lista separada por comas.
# ─────────────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://frontend-grupo-cordillera-angular.vercel.app}

# ─────────────────────────────────────────────────────────────────────────────
# Actuator: SOLO exponemos health para probes de Docker/k8s. NADA MÁS.
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ─────────────────────────────────────────────────────────────────────────────
# Spring Cloud Gateway MVC (rutas del gateway). NO TOCAR.
# ─────────────────────────────────────────────────────────────────────────────

# Autenticación
spring.cloud.gateway.server.webmvc.routes[0].id=authentication
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_URL:http://authentication:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# Ventas
spring.cloud.gateway.server.webmvc.routes[1].id=ventas
spring.cloud.gateway.server.webmvc.routes[1].uri=${VENTAS_SERVICE_URL:http://ventas:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/ventas/**

# Inventario
spring.cloud.gateway.server.webmvc.routes[2].id=inventario
spring.cloud.gateway.server.webmvc.routes[2].uri=${INVENTARIO_SERVICE_URL:http://inventario:8083}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/inventario/**

# Finanzas
spring.cloud.gateway.server.webmvc.routes[3].id=finanzas
spring.cloud.gateway.server.webmvc.routes[3].uri=${FINANZAS_SERVICE_URL:http://finanzas:8084}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/finanzas/**

# Clientes
spring.cloud.gateway.server.webmvc.routes[4].id=clientes
spring.cloud.gateway.server.webmvc.routes[4].uri=${CLIENTES_SERVICE_URL:http://clientes:8085}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/clientes/**

# Alertas
spring.cloud.gateway.server.webmvc.routes[5].id=alertas
spring.cloud.gateway.server.webmvc.routes[5].uri=${ALERTAS_SERVICE_URL:http://ms-alertas:8087}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/alertas/**

# Reportes
spring.cloud.gateway.server.webmvc.routes[6].id=reportes
spring.cloud.gateway.server.webmvc.routes[6].uri=${REPORTES_SERVICE_URL:http://ms-reportes:8088}
spring.cloud.gateway.server.webmvc.routes[6].predicates[0]=Path=/reportes/**

# KPIs URL for KpisProxyController
kpis.url=${KPIS_SERVICE_URL:http://ms-kpis:8086}

# JWT (flujo propio LEGACY, sin uso a partir de esta etapa. Se conserva por
# compatibilidad con clases antiguas que aún no se retiran).
jwt.secret=${JWT_SECRET:clave-secreta-grupo-cordillera-2025-muy-larga}
