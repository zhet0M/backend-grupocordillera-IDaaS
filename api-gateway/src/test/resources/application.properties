# =============================================================================
# PERFIL DE TESTS OFFLINE - api-gateway
# =============================================================================
# Cualquier valor aqui SOBREESCRIBE al de src/main/resources/application.properties
# durante la ejecucion de tests.
#
# OBJETIVO: los tests NO deben necesitar conexion de red ni a Microsoft Entra ID.
# No hacemos llamadas a /.well-known ni a /discovery/v2.0/keys durante tests.
# El JwtDecoder "productivo" se sobreescribe (vease @TestConfiguration) o
# se usa el JwtDecoder de Spring Security test con claves RSA locales.
# =============================================================================

# --- Microsoft Entra ID (valores mock igual que el productivo para los claims) ---
azure.tenant-id=4250abc2-359b-45d6-8fb2-732e71b2a277
azure.issuer=https://login.microsoftonline.com/4250abc2-359b-45d6-8fb2-732e71b2a277/v2.0
azure.audience=289a7d84-7d8d-4bea-b2a8-380f6e89043a
azure.api-scope=access_as_user
# NOTA: azure.jwk-set-uri NO lo usamos en tests. Cada test @Nested provee su propio
# JwtDecoder con public key local RSA via @TestConfiguration.
azure.jwk-set-uri=http://localhost:9999/mock-jwks

# --- Spring Security OAuth2: jwk-set-uri productivo sobrescrito a URL mock ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${azure.jwk-set-uri}

# --- Seguridad ---
security.swagger-public=true

# --- CORS ---
cors.allowed-origins=http://localhost:4200,https://frontend-grupo-cordillera-angular.vercel.app

# --- Actuator (igual que productivo) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Gateway MVC rutas: apuntamos a URLs dummy; los tests usan @RestController
#     mock interno en vez de enrutar a microservicios reales via RestTemplate. ---
AUTH_SERVICE_URL=http://localhost:9999
VENTAS_SERVICE_URL=http://localhost:9999
INVENTARIO_SERVICE_URL=http://localhost:9999
FINANZAS_SERVICE_URL=http://localhost:9999
CLIENTES_SERVICE_URL=http://localhost:9999
ALERTAS_SERVICE_URL=http://localhost:9999
REPORTES_SERVICE_URL=http://localhost:9999
KPIS_URL=http://localhost:9999

# --- JWT legacy (sin uso) ---
jwt.secret=clave-secreta-tests-offline-grupo-cordillera-2025

# --- Logging reducido en tests para no llenar la consola ---
logging.level.root=WARN
logging.level.com.grupocordillera.api_gateway=INFO
logging.level.org.springframework.security=INFO
