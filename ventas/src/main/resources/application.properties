spring.application.name=ventas
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5443/bd_ventas
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Resilience4j
resilience4j.circuitbreaker.instances.finanzas.sliding-window-size=10
resilience4j.circuitbreaker.instances.finanzas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.finanzas.wait-duration-in-open-state=5s

# Reintento de sincronizacion con finanzas
finanzas.reintento.delay-ms=60000

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:cordillera}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:cordillera123}

# Configuracion centralizada de nombres (Evita strings sueltos en el codigo)
app.rabbitmq.exchanges.cordillera-exchange=cordillera.topic.exchange
app.rabbitmq.routing-keys.venta-registrada=cordillera.venta.registrada
